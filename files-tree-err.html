const QUELLE  = "/home/wkolbe/MX/PDFDRILL";

];
const FEHLER = [
{t:"11:59:26",b:"Quelle",o:"/home/wkolbe/MX/PDFDRILL",m:"liegt im Zielbaum"},
];

const I18N = {
  de: { titel: "Fehler", suche: "in den Meldungen suchen ...", zeit: "Zeit",
        bereich: "Bereich", objekt: "Objekt", meldung: "Meldung",
        eintraege: "Meldungen", eine: "Meldung", keine: "keine Treffer",

        hinweis: "Der Lauf wurde nicht abgebrochen. Alles ausser den hier "

        quelle: "Quelle", baum: "Zielbaum", erzeugt: "erzeugt",
        liste: "zur Dateiliste", autor: "Autor" },
  en: { titel: "Errors", suche: "search the messages ...", zeit: "Time",

        quelle: "source", baum: "tree", erzeugt: "generated",

};

function merken(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* egal */ } }
function gemerkt(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

let LANG = gemerkt("ft_lang") || "de";
const T = (k) => I18N[LANG][k] || k;

const koerper = document.getElementById("koerper");
for (const f of FEHLER) {
  const tr = document.createElement("tr");
  tr.dataset.hay = (f.t + " " + f.b + " " + f.o + " " + f.m).toLowerCase();
  const a = document.createElement("td"); a.className = "klein"; a.textContent = f.t;
  const b = document.createElement("td"); b.className = "klein"; b.textContent = f.b;
  const c = document.createElement("td"); c.className = "objekt"; c.textContent = f.o;
  const d = document.createElement("td"); d.textContent = f.m;
  tr.append(a, b, c, d);
  koerper.appendChild(tr);
}

function filtern() {
  const q = document.getElementById("suche").value.trim().toLowerCase();
  let sichtbar = 0;
  for (const tr of koerper.querySelectorAll("tr")) {
    const treffer = !q || tr.dataset.hay.includes(q);
    tr.hidden = !treffer;
    if (treffer) sichtbar++;
  }
  document.getElementById("zaehler").textContent = sichtbar + " " +
    (sichtbar === 1 ? T("eine") : T("eintraege")) +
    (sichtbar !== FEHLER.length ? " (" + FEHLER.length + ")" : "");
  document.getElementById("leer").hidden = sichtbar !== 0;
  document.getElementById("leer").textContent = T("keine");
}

function sprache() {
  document.documentElement.lang = LANG;
  document.querySelector(".kopf .titel").firstChild.textContent = T("titel");
  for (const e of document.querySelectorAll("[data-i18n]")) e.textContent = T(e.dataset.i18n);
  for (const e of document.querySelectorAll("[data-i18n-ph]")) e.placeholder = T(e.dataset.i18nPh);
  document.getElementById("btn-lang").textContent = LANG === "de" ? "EN" : "DE";
  const zt = ZOOM_TITEL[LANG];
  document.getElementById("btn-zoom-minus").title = zt[0];
  document.getElementById("btn-zoom-wert").title = zt[1];
  document.getElementById("btn-zoom-plus").title = zt[2];
  document.getElementById("btn-thema").textContent = T("thema") + ": " + T("thema_" + THEMA);
  themaListeBauen();
  const sa = document.getElementById("btn-suchart");
  if (sa) {
    sa.textContent = T("suchart_" + SUCHART);
    sa.title = T("suchart_" + SUCHART + "_hilfe");
    sa.classList.toggle("aktiv", SUCHART !== "teil");
    document.getElementById("suche-global").placeholder =
      SUCHART === "teil" ? T("suche_alles")
                         : (SUCHART === "muster" ? T("suche_muster") : T("suche_klang"));
  }
  document.getElementById("hinweis").textContent = T("hinweis");
  const u = document.getElementById("umfeld");
  u.innerHTML = "";
  for (const [k, v] of [[T("quelle"), QUELLE], [T("baum"), BAUM], [T("erzeugt"), ERZEUGT]]) {
    const d = document.createElement("div");
    d.textContent = k + ": " + v;
    u.appendChild(d);
  }
  const z = document.createElement("div");
  const a = document.createElement("a");
  a.href = LISTE; a.textContent = T("liste");
  z.appendChild(a);
  u.appendChild(z);
  const c = document.createElement("div");
  c.style.marginTop = "0.5rem";
  c.textContent = COPYRIGHT + "  |  " + T("autor") + ": " + AUTOR;
  u.appendChild(c);
  filtern();
}

document.getElementById("btn-lang").addEventListener("click", () => {
  LANG = LANG === "de" ? "en" : "de"; merken("ft_lang", LANG); sprache();
});
let THEMA = gemerkt("ft_thema") || "hell";
if (!THEMEN.some((t) => t.k === THEMA)) THEMA = "hell";

function themaSetzen(k) {
  THEMA = k;
  document.body.className = k;
  merken("ft_thema", k);
  sprache();
}

function themaListeBauen() {
  const koerper = document.getElementById("themaliste");
  koerper.innerHTML = "";
  for (const t of THEMEN) {
    const tr = document.createElement("tr");
    tr.classList.toggle("aktiv", t.k === THEMA);
    const td1 = document.createElement("td");
    for (const farbe of t.f) {
      const tupfen = document.createElement("span");
      tupfen.className = "tupfen";
      tupfen.style.background = farbe;
      td1.appendChild(tupfen);
    }
    const td2 = document.createElement("td");
    td2.textContent = T("thema_" + t.k) + (t.k === THEMA ? "  \u2713" : "");
    tr.append(td1, td2);
    tr.addEventListener("click", () => {
      themaSetzen(t.k);
      document.getElementById("themawahl").hidden = true;
    });
    koerper.appendChild(tr);
  }
}

document.getElementById("btn-thema").addEventListener("click", (e) => {
  const tafel = document.getElementById("themawahl");
  tafel.hidden = !tafel.hidden;
  e.stopPropagation();
});
document.addEventListener("click", (e) => {
  const tafel = document.getElementById("themawahl");
  if (!tafel.hidden && !tafel.contains(e.target)) tafel.hidden = true;
});
const ZOOM_MIN = 20, ZOOM_MAX = 180, ZOOM_SCHRITT = 10, ZOOM_MITTE = 100;
const ZOOM_TITEL = {
  de: ["kleiner", "zur\u00fcck auf 100%", "gr\u00f6\u00dfer"],
  en: ["smaller", "back to 100%", "larger"]
};
let ZOOM = parseInt(gemerkt("ft_zoom") || String(ZOOM_MITTE), 10);
if (isNaN(ZOOM)) ZOOM = ZOOM_MITTE;

function zoom(neu) {
  ZOOM = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, Math.round(neu / ZOOM_SCHRITT) * ZOOM_SCHRITT));
  document.documentElement.style.fontSize = (16 * ZOOM / 100).toFixed(2) + "px";
  const w = document.getElementById("btn-zoom-wert");
  w.textContent = ZOOM + "%";
  document.getElementById("btn-zoom-minus").disabled = ZOOM <= ZOOM_MIN;
  document.getElementById("btn-zoom-plus").disabled = ZOOM >= ZOOM_MAX;
  merken("ft_zoom", String(ZOOM));
}
document.getElementById("btn-zoom-minus").addEventListener("click", () => zoom(ZOOM - ZOOM_SCHRITT));
document.getElementById("btn-zoom-plus").addEventListener("click", () => zoom(ZOOM + ZOOM_SCHRITT));
document.getElementById("btn-zoom-wert").addEventListener("click", () => zoom(ZOOM_MITTE));
document.getElementById("btn-druck").addEventListener("click", () => window.print());
document.getElementById("suche").addEventListener("input", filtern);

document.body.className = THEMA;
zoom(ZOOM);
document.getElementById("badge").textContent = VERSION;
sprache();
</script>

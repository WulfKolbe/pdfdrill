- name: refine
  section: Enhancement (mutates the model)
  summary: 'Propose, verify and record corrections to low-confidence maths values.
    Six stages, each able to stop a proposal: select (low-confidence rows, minus
    those the ink gate says already match the scan), propose (one re-transcription
    per row, written to changes.json with status proposed / basis inferred /
    author), validate (width uniformity, environment balance, CJK, standalone
    xelatex compile), measure (render the proposal, measure it against the scan
    crop), accept (keep it only when the ink distance FALLS), record (attach it as
    a provenance="change" realization carrying the verification that actually ran,
    with before/after; the original `latex` is never overwritten). Nothing is
    applied because a model proposed it. A second acceptance route exists for rows
    the ink gate cannot reach (an inline formula has no region and no crop): with
    basis=eprint the gate reads the value out of the AUTHOR''s arXiv e-print at
    that site, located by its surrounding prose, and accepts only if the source
    agrees. It is a check, not a flag.'
  network: true
  requires:
  - model
  - mathpix
  positionals:
  - name: pdf
    type: pdf
    required: true
    help: PDF path, https URL, or bare arXiv id
  flags:
  - name: max_conf
    flag: --max-conf
    type: float
    help: only rows at or below this MathPix confidence (default 0.5)
  - name: limit
    flag: --limit
    type: int
    help: cap the number of rows selected (worst confidence first)
  - name: stages
    flag: --stages
    type: str
    help: 'comma list of stages to run; default all. An unknown name is refused
      rather than silently running nothing (e.g. --stages select,propose)'
  - name: model
    flag: --model
    type: str
    help: proposing model id (default minimax/minimax-m3 on Novita)
  - name: author
    flag: --author
    type: str
    help: value recorded as `author` on each proposal (default minimax-m3)
  - name: dpi
    flag: --dpi
    type: int
    help: raster resolution for the render/scan comparison (default 400, the
      project floor)
  - name: request
    flag: --request
    type: str
    help: 'change-request JSON to ingest before the stages run: {proposals:
      [{target, field, proposed, basis, author, rationale}]}. `target` is an
      object id or an identifier (0707.4470_FO0175). basis=eprint routes the
      proposal to the author-source check instead of the ink gate'
  typed: true
- name: modeldiff
  section: Introspection (fast, no extraction)
  summary: 'P8: field-level diff of two model JSON files — per changed object the changed fields with old
    and new values, the evidence path backing the new value (edit_source stamp / a <field>_source twin /
    the realization carrying it) and the source tag; changed objects with NO evidence path are listed
    under UNEVIDENCED and counted separately. Added/removed objects listed.'
  offline_ok: true
  positionals:
  - name: old
    type: str
    required: true
    help: the OLD model.docmodel.json
  - name: new
    type: str
    required: true
    help: the NEW model.docmodel.json
  typed: true
- name: trailingpunct
  section: Introspection (fast, no extraction)
  summary: '025: move a TOP-LEVEL trailing sentence mark (, ; . :) out of each math object''s latex into
    a trailing_punct field — the TiddlyWiki separation made portable: the character lives beside the
    math (projections re-emit it outside the widget), latex holds mathematics only, and comparison
    sees neither side''s copy. Keeps latex_prepunct, stamps edit_source, idempotent.'
  offline_ok: true
  requires:
  - model
  positionals:
  - name: pdf
    type: pdf
    required: true
    help: PDF path, https URL, or bare arXiv id
  typed: true
- name: latexnorm
  section: Introspection (fast, no extraction)
  summary: '021: join every LONE backslash severed from its command name (a backslash, whitespace, then
    a letter — LaTeX reads the gap as a control space and typesets the literal letters). Only the
    severing gap is removed; all other whitespace is untouched and runs of two backslashes (real row
    breaks) are never changed. Keeps the original as <field>_presevered and stamps edit_source.'
  offline_ok: true
  requires:
  - model
  positionals:
  - name: pdf
    type: pdf
    required: true
    help: PDF path, https URL, or bare arXiv id
  typed: true
- name: tailsplit
  section: Introspection (fast, no extraction)
  summary: 'P7: split math regions carrying a PROSE tail (MathPix keeps the sentence fragment inside the
    math region, e.g. mathrm(nach Addition) … mathrm(was im Ver-)) into <id> (expression,
    tail stripped, original kept as latex_pretail) + <id>.tail (MathTail prose object). Idempotent.
    Census 2026-08-18: 36 EQ across bh2/BH1org/WDorg4, 0 inline formulas.'
  offline_ok: true
  requires:
  - model
  positionals:
  - name: pdf
    type: pdf
    required: true
    help: PDF path, https URL, or bare arXiv id
  typed: true

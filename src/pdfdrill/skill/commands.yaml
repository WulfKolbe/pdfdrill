  section: Introspection (fast, no extraction)
  summary: 'LaTeX formula report (report.tex): one boxed longtable row per EQ/FO/TAB — identifier, page,
    escaped source, rendered math, and the MathPix scan crop at pixel-exact original size (px2mm derived
    from pdfinfo + lines.json); the tex.zip unrecovered image regions (TikZ/table/failed-math candidates)
    close the report. --compile runs the xelatex fixpoint (malformed OCR rows demoted to source-only,
    never failing the document).'
  offline_ok: true

  flags:
  - name: dpi
    flag: --dpi
    type: int
    help: pyramid full-res DPI (default 600)
  - name: force
    flag: --force
    type: flag
    help: rebuild even if a pyramid exists
  - name: offline
    flag: --offline
    type: flag
    help: also write the server-free bundle (viewer_offline.html + vendored
      OpenSeadragon — opens via file://, no server/network); on an existing
      pyramid it just adds the bundle
- name: imageserve
  section: Introspection (fast, no extraction)
  summary: 'Serve the doc''s local pyramid as a MathPix-free image source: a drop-in
    cdn.mathpix.com (/cropped/<id>?top_left_x=… assembled from the 600-DPI tiles) PLUS the
    deep-zoom viewer (/viewer.html). Run `pdfdrill pyramid` first. Foreground (Ctrl-C) unless
    --background. The bun drillui bridge spawns this and proxies /cropped,/tiles,/viewer.html'
  offline_ok: true
  positionals:
  - name: pdf
    type: pdf
    required: true
    help: PDF path, https URL, or bare arXiv id
  typed: true
  flags:
  - name: port
    flag: --port
    type: int
    help: HTTP port to bind (default 8000)
  - name: dpi
    flag: --dpi
    type: int
    help: pyramid full-res DPI for MathPix→pyramid scaling (default from the build, 600)
  - name: background
    flag: --background
    type: flag
    help: spawn detached and return the URL (default foreground, Ctrl-C to stop)
- name: lean
  section: Introspection (fast, no extraction)
  summary: 'Export theorems to Lean 4: STORE LLM-generated Lean per Theorem (props/tiddler
    lean4 field, like bibfetch) then PROJECT <bibkey>.lean from the stored code (sorry-stub
    if ungenerated). Needs theorem envs from a LaTeX-source build'
  offline_ok: true
  positionals:
  - name: pdf
    type: pdf
    required: true
    help: PDF path, https URL, or bare arXiv id
  typed: true
  requires:
  - model
  network: true
  flags:
  - name: limit
    flag: --limit
    type: int
    help: cap the number of LLM translations
  - name: force
    flag: --force
    type: flag
    help: re-generate even theorems that already have stored Lean
  - name: emit-only
    flag: --emit-only
    type: flag
    help: skip generation, just re-project <bibkey>.lean from stored code
- name: scikgtex
  section: Introspection (fast, no extraction)
  summary: Project to SciKGTeX-annotated LaTeX → compiled PDF carries ORKG contribution metadata (title/authors/field
    + research-problem/method/result roles + numeric facts + bib-DOI links) as XMP/RDF. --compile (lualatex
    + vendored scikgtex)
  offline_ok: true
  positionals:
  - name: pdf
    type: pdf
    required: true
    help: PDF path, https URL, or bare arXiv id
  typed: true
  requires:
  - model
  flags:
  - name: compile
    flag: --compile
    type: flag
- name: skill
  section: Introspection (fast, no extraction)
  summary: Emit/serve the bundled SKILL folder (--emit DIR | --json | --check)
  offline_ok: true
  flags:
  - name: emit
    flag: --emit
    type: dir
    help: write the complete SKILL folder to DIR
  - name: json
    flag: --json
    type: flag
    help: print the typed manifest as JSON
  - name: check
    flag: --check
    type: flag
    help: manifest <-> handler-dict parity
  typed: true
- name: steps
  section: Planning & automation
  summary: Show the prerequisite chain for a command (what's done, what --ensure would run)
  offline_ok: true
  positionals:
  - name: cmd
    type: str
    required: true
    help: target command
  - name: pdf
    type: pdf
    required: true
  typed: true
- name: speak
  section: Analysis (needs a built model)
  summary: render every formula to SPEECH with the vendored la2speech (MathML → speech-rule-engine)
    and store it as `spoken` on the object; feeds the EXPANDED latex, idempotent
  offline_ok: true
  requires:
  - model
  done_when: fact:SPOKEN_BUILT
  positionals:
  - name: pdf
    type: pdf
    required: true
    help: PDF path, https URL, or bare arXiv id
  flags:
  - name: limit
    flag: --limit
    type: int
    help: only render the first N formulas
  - name: force
    flag: --force
    type: flag
    help: re-render objects that already carry `spoken`
  - name: domain
    flag: --domain
    type: str
    help: 'speech rule domain: clearspeak (default) | mathspeak'
  typed: true
- name: spoken
  section: Analysis (needs a built model)
  summary: the LLM INPUT text — prose in flow order with each math marker replaced by
    its spoken form; formulas with no spoken yet are shown visibly, not dropped
  offline_ok: true
  requires:
  - speak
  positionals:
  - name: pdf
    type: pdf
    required: true
    help: PDF path, https URL, or bare arXiv id
  flags:
  - name: n
    flag: --n
    type: str
    help: 'show ONE formula''s spoken form: Nth display equation or printed number'
  - name: id
    flag: --id
    type: str
    help: show ONE formula by math tiddler title or object id
  - name: out
    flag: --out
    type: str
    help: write to this file instead of printing
  - name: json
    flag: --json
    type: flag
    help: structured blocks with ids/section/counts instead of plain text
  - name: fallback
    flag: --fallback
    type: str
    help: 'what stands in for a missing spoken form: latex (default) | mark | drop'
  - name: print
    flag: --print
    type: flag
    help: dump the whole text to the terminal instead of writing a file
  - name: footnotes
    flag: --footnotes
    type: str
    help: 'footnote handling: hint (default, "(see footnote)") | drop | keep'
  - name: cites
    flag: --cites
    type: str
    help: 'citation markers: number (default, [1] [2] …) | key | drop'
  typed: true
- name: expandmath
  section: Analysis (needs a built model)
  summary: persist fully macro-expanded LaTeX into the docmodel — stores latex (expanded),
    latex_original (author source) and macros_unresolved on every Formula/Equation; idempotent
  offline_ok: true
  requires:
  - model
  positionals:
  - name: pdf
    type: pdf
    required: true
    help: PDF path, https URL, or bare arXiv id
  flags:
  - name: force
    flag: --force
    type: flag
    help: re-expand objects already marked expanded
  typed: true
- name: sre
  section: Analysis (needs a built model)
  summary: spoken-math projection for latex2mml → MathML → speech-rule-engine — emits
    macro-free latex_sre per formula (latex2mml expands nothing) and flags units whose
    unresolved macros would be mis-spoken
  offline_ok: true
  requires:
  - model
  positionals:
  - name: pdf
    type: pdf
    required: true
    help: PDF path, https URL, or bare arXiv id
  flags:
  - name: out
    flag: --out
    type: str
    help: write the JSON here instead of the drill folder
  - name: plain
    flag: --plain
    type: flag
    help: print only latex_sre, one per line (latex2mml-ready)
  - name: safe-only
    flag: --safe-only
    type: flag
    help: drop units that still carry unresolved macros
  typed: true
- name: formulas
  section: Analysis (needs a built model)
  summary: math projection for an external de-macro / SRE pipeline — every Formula/Equation
    in flow order with id, transclusion placeholder, expanded latex, latex_original,
    its control sequences and the document-defined macros expansion left unresolved
  offline_ok: true
  requires:
  - model
  positionals:
  - name: pdf
    type: pdf
    required: true
    help: PDF path, https URL, or bare arXiv id
  flags:
  - name: out
    flag: --out
    type: str
    help: write the JSON here instead of the drill folder
  - name: plain
    flag: --plain
    type: flag
    help: print only the latex, one per line (no JSON)
  typed: true
- name: docs
  accepts_combined: true
  section: Introspection (fast, no extraction)
  summary: ONE LINE per document in a session (title + bibkey) — the compact counterpart
    to bibtex; on a single doc, its title
  offline_ok: true
  positionals:
  - name: pdf
    type: pdf
    required: true
    help: combined session store, PDF path, https URL, or bare arXiv id
  flags:
  - name: titles
    flag: --titles
    type: flag
    help: print only the titles, one per line
  typed: true
- name: combine
  section: Planning & automation
  summary: 'Merge several drilled docs into ONE combined store (--out FILE) for MULTI-DOCUMENT chat/retrieve;
    pools prose/math/concepts, ids namespaced <bibkey>:<id>. Each input must be drilled (model) first'
  offline_ok: true
  positionals:
  - name: docs
    type: path
    required: true
    help: two or more drilled PDFs/.md (each needs a built model)
  flags:
  - name: out
    flag: --out
    type: path
    help: combined store file (e.g. heim.docpack)
  - name: force
    flag: --force
    type: flag
  typed: true
- name: reconcile
  section: Planning & automation
  summary: 'Dual-route reconciliation (parallel MathPix + pdfminer.six): keep the pdfminer model''s
    STRUCTURE (citations/figrefs/transclusions/front-matter) + GEOMETRY (self-contained inspect), correct
    its garbled MATH with MathPix''s clean LaTeX, region-matched (per-aspect best-of). Runs the math-garble
    QC always; adopts MathPix when a `--mathpix LINES.json` source is present (else reports the garble +
    next step). Geometry never touched; original kept as latex_pdfminer.'
  offline_ok: true
  requires:
  - model
  positionals:
  - name: pdf
    type: pdf
    required: true
    help: PDF path, https URL, or bare arXiv id
  flags:
  - name: mathpix
    flag: --mathpix
    type: str
    help: a MathPix lines.json to reconcile against
  - name: adopt-all
    flag: --adopt-all
    type: flag
    help: adopt MathPix on ALL matched eqs, not just garbled
  typed: true
- name: occurrences
  section: Query
  summary: 'Emit <bibkey>.occurrences.json — a per-element region list (page + top_left_x/y/width/height +
    tiddler title) for the optional EXTERNAL image-enrichment tools (locate an element on the rendered page
    by region, no content matching). Region-bearing types only: Equation by default, --type adds Table/
    Picture/Diagram. Inline Formula excluded (deduped, no per-object region).'
  offline_ok: true
  requires:
  - model
  positionals:
  - name: pdf
    type: pdf
    required: true
    help: PDF/Markdown drilled-doc path, URL, or arXiv id
  flags:
  - name: type
    flag: --type
    type: str
    help: comma list of region types (default Equation; Table/Picture/Diagram)
  typed: true
- name: rename
  section: Extraction
  summary: 'Rename a drilled FOLDER (and optionally its bibkey namespace) WITHOUT a rebuild. Moves the
    directory and its <stem>.* files, retargets the PATH and IDENTIFIER fields inside model / sidecar /
    tiddlers / report.tex, moves the bibkey-named crops and OKF bundle, and records the prior names in
    meta.folder_history and meta.bibkey_history. Never substitutes the old name as a string: an arXiv
    folder is named for the arXiv id, which is printed on page 1 and therefore sits in the OCR text, the
    PDF title and the derived BibTeX. Never rebuilds, so translations and in-place enrichments survive.'
  offline_ok: true
  requires:
  - model
  positionals:
  - name: pdf
    type: pdf
    required: true
    help: PDF/Markdown drilled-doc path, URL, or arXiv id
  - name: name
    type: str
    required: true
    help: the new folder name
  flags:
  - name: bibkey
    flag: --bibkey
    type: str
    help: also rename the object namespace (tiddler titles, crops, OKF bundle) to this key
  - name: dry_run
    flag: --dry-run
    type: flag
    help: report what would move and change nothing
  typed: true
- name: okf
  section: Extraction
  summary: 'Project the docmodel into an OKF (Open Knowledge Format) BUNDLE: one Markdown-with-YAML-frontmatter
    file per knowledge unit (required `type`) + a reserved index.md, cross-linked by [label](./unit.md)
    markdown links. OKF is the tiddler bundle re-serialized; the .md files open in drillui like any
    markdown. Written to <drill>/okf/<bibkey>/ (or --out DIR).'
  offline_ok: true
  requires:
  - model
  positionals:
  - name: pdf
    type: pdf
    required: true
    help: PDF/Markdown drilled-doc path, URL, or arXiv id
  flags:
  - name: out
    flag: --out
    type: str
    help: write the bundle to DIR (default <drill>/okf/<bibkey>/)
  - name: bibkey
    flag: --bibkey
    type: str
    help: tiddler/title prefix + bundle folder name
  - name: semantic
    flag: --semantic
    type: flag
    help: project the SEMANTIC GRAPH (entities/relations) not the docmodel — the commercial-doc form
  typed: true
- name: context
  accepts_combined: true
  section: Planning & automation
  summary: 'Project the docmodel into an LLM CONTEXT (deterministic structural RAG): select typed objects
    by free-text query + --type/--concept/--section, rank (structural/IDF now; pluggable per-aspect
    embedding rankers later), render Markdown blocks with metadata + object ids under --max-tokens N.
    The LLM sees a projection, never the whole doc or a filename. Also accepts a combined store.'
  offline_ok: true
  requires:
  - model
  positionals:
  - name: pdf
    type: pdf
    required: true
    help: PDF/Markdown drilled-doc path, URL, or arXiv id
  - name: query
    type: str
    required: false
    help: free-text query (optional; flow order without it)
  flags:
  - name: type
    flag: --type
    type: str
    help: comma list — definition,formula,theorem,figure,table,reference,concept
  - name: concept
    flag: --concept
    type: str
    help: a named concept + its occurrences
  - name: section
    flag: --section
    type: str
    help: restrict to a section number/caption
  - name: k
    flag: --k
    type: int
    help: cap the number of units
  - name: max-tokens
    flag: --max-tokens
    type: int
    help: token budget for the projected context
  - name: aspect
    flag: --aspect
    type: str
    help: ranker aspect (default structural; math/citation later)
  - name: out
    flag: --out
    type: str
    help: write Markdown to FILE
  typed: true
- name: retrieve
  accepts_combined: true
  section: Planning & automation
  summary: 'Transform a question into grounded context: top-k relevant drilled units (the chat-proxy enrichment
    / future-SKILL seed). Also accepts a COMBINED store (multi-document)'
  offline_ok: true
  requires:
  - model
  positionals:
  - &id002
    name: pdf
    type: pdf
    required: true
    help: PDF/Markdown drilled-doc path, URL, or arXiv id
  - name: question
    type: str
    required: true
  flags:
  - name: k
    flag: --k
    type: int
    default: 8
    help: number of units
  - name: json
    flag: --json
    type: flag
    help: machine-readable {units,prompt}
  typed: true
- name: chatlog
  section: Planning & automation
  summary: 'Store one Q&A turn: append the transcript + emit the answer as a kitem in the semantic graph
    (provenance qid=ask)'
  offline_ok: true
  positionals:
  - *id002
  flags:
  - name: question
    flag: --question
    type: str
    required: true
  - name: answer
    flag: --answer
    type: str
    required: true
  - name: units
    flag: --units
    type: str
    help: comma-separated cited unit ids
  - name: model
    flag: --model
    type: str
    help: the LLM that answered
  - name: verdict
    flag: --verdict
    type: str
    help: correct|wrong — calibration feedback feeding the ask --precision gate
  typed: true
- name: remath
  section: OCR / model pipeline
  summary: 'Keyless MathPix replacement: rebuild MathPix-quality Markdown (LaTeX math) from rendered pages
    via Claude delegation, so transclusion works without a MathPix key'
  offline_ok: true
  positionals:
  - name: pdf
    type: pdf
    required: true
    help: PDF path, https URL, or bare arXiv id
  flags:
  - name: pages
    flag: --pages
    type: pages
    help: N | N-M | all (default all)
  - name: force
    flag: --force
    type: flag
  typed: true
- name: visionocr
  section: OCR / model pipeline
  summary: 'Keyless agent-delegated EQUATION OCR: rasterize each page → the running Claude reads the math →
    fold {page,number,latex,kind} records into the lines.json as real Equation nodes (number paired by
    geometry). The keyless math route when tesseract built a doc prose-only (NEEDS_VISION_OCR)'
  offline_ok: true
  positionals:
  - name: pdf
    type: pdf
    required: true
    help: PDF path, https URL, or bare arXiv id
  flags:
  - name: ingest
    flag: --ingest
    type: str
    help: 'fold a records JSON file ([{page,number,latex,kind}] or {records:[…]}) directly, skip delegation'
  - name: dpi
    flag: --dpi
    type: int
    default: 200
  - name: pages
    flag: --pages
    type: pages
    help: N | N-M | all (default all)
  - name: force
    flag: --force
    type: flag
  typed: true
help_intro: 'pdfdrill — portable PDF drill-down toolkit


  Input: <pdf> may be a local path OR an https URL from a known host. arXiv URLs/ids

  (https://arxiv.org/abs/<id>, /pdf/<id>, or a bare 2510.11170v2) download the PDF

  once (cached) and unlock the FREE routes — `abstract` reads the abs page and

  `latex` downloads the e-print .tgz (gold equations), so MathPix is skipped by

  default. NEVER curl/wget/tar a PDF or e-print

  yourself, and never hand-process .tex/.tgz — pass the URL/id/path; pdfdrill

  decides if/when to use the LaTeX source.'

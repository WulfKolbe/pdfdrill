# SINGLE SOURCE OF TRUTH for the pdfdrill command surface.
# `pdfdrill --help`, the SKILL.md tables, and the external drillui TUI are
# all GENERATED from this manifest; `pdfdrill skill --check` / the skill-sync
# CI gate fail on drift vs cli.py's HANDLERS. `typed: false` entries still
# need their flags filled in (Claude fills them per command over time).
# requires:/done_when: drive the prerequisite planner (`pdfdrill steps`, --ensure).

version: 1
tool: pdfdrill
invocation: PYTHONPATH=src python3 -m pdfdrill
commands:
- name: doctor
  section: Introspection (fast, no extraction)
  summary: 'Requirement check: system tools (poppler/tesseract/LaTeX+dvisvgm), Python deps, API keys +
    the apt-get fix line'
  offline_ok: true
  typed: true
- name: preflight
  section: Introspection (fast, no extraction)
  summary: 'MANDATORY first step. Prints the critical usage rules + an env check; build/extract commands
    are hard-blocked until you attest you read the SKILL via `preflight --ack <TOKEN>` (the token is the
    SKILL''s last line). Read-only commands stay open. Automation may set PDFDRILL_NO_PREFLIGHT=1.'
  offline_ok: true
  positionals:
  - name: token
    type: str
    required: false
    help: 'the DRILL-… attestation token from the SKILL''s last line (or use --ack)'
  flags:
  - name: ack
    flag: --ack
    type: flag
    help: acknowledge the attestation token → unlock build/extract commands
  typed: true
- name: config
  section: Introspection (fast, no extraction)
  summary: 'Show / init / set the config FILE (not CLI flags): download_dir (where URL/arXiv downloads
    land) + library_root (the git folder holding one self-contained folder per drilled doc). --init;
    --json; --download-dir [DIR]; --library-root DIR'
  offline_ok: true
  flags:
  - name: init
    flag: --init
    type: flag
  - name: json
    flag: --json
    type: flag
  - name: download_dir
    flag: --download-dir
    type: flag
    help: show (no value) or SET the download dir
  - name: library_root
    flag: --library-root
    type: flag
    help: show (no value) or SET the library root (relocate target)
  typed: true
- name: relocate
  section: Introspection (fast, no extraction)
  summary: 'Migrate legacy scattered drills into the self-contained library layout: <library>/<stem>/
    holding the PDF + every X.* sibling + the flattened X.pdf.drill/ blobs (X.pdf.drill.json → X.drill.json).
    Dry-run by default; --apply moves. Collision-safe + idempotent.'
  offline_ok: true
  positionals:
  - name: paths
    type: str
    required: false
    help: PDF(s) and/or dir(s) to scan for legacy drills (default the library root)
  flags:
  - name: apply
    flag: --apply
    type: flag
    help: perform the moves (default dry-run)
  - name: library
    flag: --library
    type: flag
    help: target library root (default config library_root)
  typed: true
- name: artifacts
  section: Introspection (fast, no extraction)
  summary: 'List the openable files in the doc''s drill folder (report.html, the extracted <bibkey>.md,
    tiddlers/semantic/llm *.json/*.txt, SVGs) with paths — clickable in the drillui Outputs panel. Giant
    model JSON hidden unless --all. (`status` also lists them.)'
  offline_ok: true
  positionals:
  - name: pdf
    type: pdf
    required: true
    help: PDF/Markdown drilled-doc path, URL, or arXiv id
  flags:
  - name: all
    flag: --all
    type: flag
    help: include the giant model/ir JSON
  typed: true
- name: size
  section: Introspection (fast, no extraction)
  summary: File size, page count, producer
  offline_ok: true
  positionals:
  - name: pdf
    type: pdf
    required: true
    help: PDF path, https URL, or bare arXiv id
  typed: true
  done_when: fact:SIZE_KNOWN
- name: ls
  section: Introspection (fast, no extraction)
  summary: 'Shallow-scan a FOLDER: run pdfinfo (size) on every PDF, store it in each file''s sidecar,
    and report a compact table led by the PRODUCER (the triage signal). The cheapest rung over a
    whole directory; size is cached so re-running is fast. --images adds the pdfimages count.'
  offline_ok: true
  positionals:
  - name: dir
    type: str
    required: false
    help: folder to scan (default the current directory)
  flags:
  - name: images
    type: flag
    flag: --images
    help: add the pdfimages -list count column
  typed: true
- name: route
  section: Introspection (fast, no extraction)
  summary: 'Auto-pick the OCR lane and (with --run) EXECUTE it: born-digital → pdfminer/text-layer
    (free); scanned & ≤20 pages → Gemma 4 (5-parallel); scanned & larger → MathPix (large books).
    Auto-chains size. Without --run reports the decision; with --run runs the chosen lane (paid/keyed
    lanes degrade gracefully when creds are absent).'
  offline_ok: true
  positionals:
  - name: pdf
    type: pdf
    required: true
    help: PDF path, https URL, or bare arXiv id
  flags:
  - name: run
    type: flag
    flag: --run
    help: execute the chosen lane (not just report)
  typed: true
  requires:
  - size
- name: abstract
  accepts_combined: true
  section: Introspection (fast, no extraction)
  summary: Abstract from first pages
  offline_ok: true
  positionals:
  - name: pdf
    type: pdf
    required: true
    help: PDF path, https URL, or bare arXiv id
  typed: true
- name: toc
  section: Introspection (fast, no extraction)
  summary: Table of contents
  offline_ok: true
  positionals:
  - name: pdf
    type: pdf
    required: true
    help: PDF path, https URL, or bare arXiv id
  typed: true
- name: fonts
  section: Introspection (fast, no extraction)
  summary: Font analysis, math font detection
  offline_ok: true
  positionals:
  - name: pdf
    type: pdf
    required: true
    help: PDF path, https URL, or bare arXiv id
  flags:
  - name: force
    flag: --force
    type: flag
    help: re-run pdffonts, discarding the cached font layers
  typed: true
- name: status
  section: Introspection (fast, no extraction)
  summary: What is already known
  offline_ok: true
  positionals:
  - name: pdf
    type: pdf
    required: true
    help: PDF path, https URL, or bare arXiv id
  typed: true
- name: md
  section: Extraction
  summary: Full Markdown with math transclusions
  offline_ok: true
  positionals:
  - name: pdf
    type: pdf
    required: true
    help: PDF path, https URL, or bare arXiv id
  flags:
  - name: pages
    type: pages
    flag: --pages
    help: N | N-M | all
  typed: true
- name: page
  section: Extraction
  summary: Single page text extraction
  offline_ok: true
  positionals:
  - name: pdf
    type: pdf
    required: true
    help: PDF path, https URL, or bare arXiv id
  - name: n
    type: int
    required: true
    help: page number (1-based)
  typed: true
- name: fetch
  section: Query
  summary: Retrieve stored Markdown
  offline_ok: true
  positionals:
  - name: pdf
    type: pdf
    required: true
    help: PDF path, https URL, or bare arXiv id
  - name: layer
    type: enum
    required: true
    choices:
    - md
    - abstract
    - toc
    - bibtex
    help: what to retrieve
  flags:
  - name: section
    type: str
    flag: --section
    help: section number
  typed: true
- name: plan
  section: Planning & automation
  summary: 'Show what steps are needed to answer a question — or, with --goal <capability>, the ordered
    commands to establish that capability, clobber-checked against what the doc already holds (refuses a
    plan that would rebuild the model and silently destroy a held enrichment like LATEX_INGESTED).'
  offline_ok: true
  positionals:
  - name: pdf
    type: pdf
    required: true
    help: PDF path, https URL, or bare arXiv id
  - name: question
    type: str
    required: false
    help: natural-language question (omit when using --goal)
  flags:
  - name: goal
    flag: --goal
    type: flag
    help: 'capability goal (fact/alias/command, e.g. SEMANTIC_BUILT or ModelAvailable) → capability planner'
  typed: true
- name: make
  section: Planning & automation
  summary: 'Establish a capability GOAL: plan the ordered commands (clobber-checked against what the doc
    already holds), then execute them — recording proofs, stopping at the first failure. A plan that would
    rebuild the model and destroy a held enrichment is REFUSED and nothing runs.'
  offline_ok: true
  positionals:
  - name: pdf
    type: pdf
    required: true
    help: PDF path, https URL, or bare arXiv id
  - name: goal
    type: str
    required: false
    help: 'capability goal (fact/alias/command, e.g. SEMANTIC_BUILT); or pass --goal'
  flags:
  - name: goal
    flag: --goal
    type: flag
    help: capability goal to establish
  typed: true
- name: drill
  section: Planning & automation
  summary: Full auto-drill
  offline_ok: true
  positionals:
  - name: pdf
    type: pdf
    required: true
    help: PDF path, https URL, or bare arXiv id
  typed: true
  flags:
  - name: full
    flag: --full
    type: flag
    help: wipe sidecar + re-run from cold
- name: pdfinfo
  section: Introspection (fast, no extraction)
  summary: Full PdfInfo struct (title/author/dates/flags)
  offline_ok: true
  positionals:
  - name: pdf
    type: pdf
    required: true
    help: PDF path, https URL, or bare arXiv id
  typed: true
- name: bibtex
  accepts_combined: true
  section: Introspection (fast, no extraction)
  summary: 'Derived BibTeX record from embedded PDF metadata, AUGMENTED by the free arXiv abs-page
    metadata (title/authors) and — for a scanned book with no embedded metadata — the drilled
    front matter (title page title/authors + the checksum-validated ISBN from `identifiers`,
    which makes it @book); warns when still a placeholder (run abstract/model first). --force
    re-derives a cached record'
  offline_ok: true
  positionals:
  - name: pdf
    type: pdf
    required: true
    help: PDF path, https URL, or bare arXiv id
  flags:
  - name: force
    flag: --force
    type: flag
    help: re-derive even when a non-placeholder record is cached
  typed: true
- name: urls
  section: Introspection (fast, no extraction)
  summary: URL annotations with anchor text (heavier; pdfplumber)
  offline_ok: true
  positionals:
  - name: pdf
    type: pdf
    required: true
    help: PDF path, https URL, or bare arXiv id
  typed: true
- name: links
  section: Introspection (fast, no extraction)
  summary: FAST external URLs via pdfinfo -url (~50ms); flags code/data hosts; falls
    back to harvesting URLs from the page TEXT when the PDF has no annotation layer
  offline_ok: true
  positionals:
  - name: pdf
    type: pdf
    required: true
    help: PDF path, https URL, or bare arXiv id
  typed: true
- name: dests
  section: Introspection (fast, no extraction)
  summary: 'Named destinations: theorems, equations, sections'
  offline_ok: true
  positionals:
  - name: pdf
    type: pdf
    required: true
    help: PDF path, https URL, or bare arXiv id
  typed: true
- name: fonts_layer
  section: Introspection (fast, no extraction)
  summary: Structured per-font records (pdffonts)
  offline_ok: true
  positionals:
  - name: pdf
    type: pdf
    required: true
    help: PDF path, https URL, or bare arXiv id
  flags:
  - name: force
    flag: --force
    type: flag
    help: re-run pdffonts, discarding the cached font layers
  typed: true
- name: images
  section: Introspection (fast, no extraction)
  summary: Image rectangles + metadata (pdfplumber + pdfimages -list)
  offline_ok: true
  positionals:
  - name: pdf
    type: pdf
    required: true
    help: PDF path, https URL, or bare arXiv id
  typed: true
- name: tsv
  section: Introspection (fast, no extraction)
  summary: Word-level bounding boxes (pdftotext -tsv; --ocr forces tesseract)
  offline_ok: true
  positionals:
  - name: pdf
    type: pdf
    required: true
    help: PDF path, https URL, or bare arXiv id
  typed: true
  flags:
  - name: ocr
    flag: --ocr
    type: flag
    help: force OCR TSV (no text layer)
- name: render
  section: Introspection (fast, no extraction)
  summary: Render the built markdown to PDF (pandoc + lualatex)
  offline_ok: true
  positionals:
  - name: pdf
    type: pdf
    required: true
    help: PDF path, https URL, or bare arXiv id
  typed: true
  flags:
  - &id001
    name: force
    flag: --force
    type: flag
- name: mathpix
  section: Introspection (fast, no extraction)
  summary: 'MathPix OCR the PDF (lines.json + md + tex.zip next to it). Runs when asked
    — for an arXiv doc a one-line free-route note follows the work. Outputs on disk are
    reused (delete them to re-OCR).'
  network: true
  done_when: lines:mathpix
  max_concurrency: 1
  positionals:
  - name: pdf
    type: pdf
    required: true
    help: PDF path, https URL, or bare arXiv id
  typed: true
- name: ocr
  section: Introspection (fast, no extraction)
  summary: 'MathPix-free OCR for COMMERCIAL documents (scans/letters/tables/forms): Ghostscript (>=400 DPI)
    → tesseract → a MathPix-compatible lines.json. Lines are TYPED (section_header/table/equation/diagram),
    carry per-line conf + words, and their regions are PDF POINTS (units=pt) so local /cropped/ pyramid
    crops work keylessly. Language autocorrection, OSD auto-upright, text-layer merge (as a SEPARATE
    text_layer_text channel), barcodes. NO LaTeX: an equation gets a correct REGION but GARBLED text —
    math papers want mathpix/visionocr. A MathPix lines.json is backed up to
    <name>.lines.mathpix.bak.json before being replaced (executes, never refuses).'
  offline_ok: true
  positionals:
  - name: pdf
    type: pdf
    required: true
    help: PDF path, https URL, or bare arXiv id
  flags:
  - name: lang
    type: str
    flag: --lang
    default: eng+equ
    help: 'tesseract langs (eng+deu for German); the module auto-corrects the order'
  - name: ppi
    type: int
    flag: --ppi
    help: render DPI; floored at the >=400 gs minimum (a 300-DPI scan is only upsampled)
  - name: min_conf
    type: float
    flag: --min-conf
    help: 'drop words below this tesseract confidence (default 5.0 = noise floor)'
  - name: no_typing
    flag: --no-typing
    type: flag
    help: disable line typing — emit untyped "text" lines (legacy shape)
  typed: true
- name: continuity
  section: Introspection (fast, no extraction)
  summary: Full-page OCR of the MARGINS → page-sequence markers (Seite N von M / Fortsetzung) MathPix's
    content crop drops; attaches seq to Page objects
  offline_ok: true
  positionals:
  - name: pdf
    type: pdf
    required: true
    help: PDF path, https URL, or bare arXiv id
  typed: true
  flags:
  - name: lang
    flag: --lang
    type: str
    default: deu+eng
  - name: ppi
    flag: --ppi
    type: int
    default: 250
  - *id001
- name: handover
  section: Reporting
  summary: 'The pages-CLI handover list: one line per DOCUMENT under a directory,
    KEYED ON FOLDER PATH, with the title carried as a display field only. Asserts
    at runtime that the row count equals the number of distinct paths and refuses
    to emit the list otherwise, so a title collapse cannot put one document''s
    short measurement under another''s full heading. Enumerates through
    sidecar.iter_documents (a directory is not a document, and report.pdf is not
    an input). Each row: path, bibkey, title, pages, equations, residual
    distribution, refined-row count, and either READY or the checks blocking it.'
  requires:
  - reporttex
  positionals:
  - name: dir
    type: str
    required: true
    help: directory to enumerate documents under
  flags:
  - name: ready_only
    flag: --ready-only
    type: bool
    help: emit only rows that pass the full publishready checklist
  - name: as_json
    flag: --json
    type: bool
    help: machine-readable form for the pages CLI
  typed: true
- name: inkconvert
  section: Reporting
  summary: 'Convert inkdrill''s report.compare.tsv into report.ink.json. The TSV
    carries NO identifiers, so they come from report.tex positionally, in table
    order — and two things make that safe, both ASSERTED rather than assumed. The
    TSV holds one all-zero row per page (the legend footer, whose Rendered and
    Scan cells are blank because the legend spans all columns); those rows are
    dropped, because an all-zero pair scores distance 0 and would otherwise be
    classified CLEAN, an absent reading taking the best class. After dropping
    them the row count must equal the identifier count exactly, or the command
    REFUSES rather than letting zip() truncate silently. Reports
    footers_dropped, display_pages and the class distribution.'
  requires:
  - reporttex
  positionals:
  - name: pdf
    type: pdf
    required: true
    help: PDF path, https URL, or bare arXiv id
  flags:
  - name: force
    flag: --force
    type: bool
    help: replace an existing report.ink.json
  typed: true
- name: publishready
  section: Reporting
  summary: 'Is this document''s report fit to publish? The five-item checklist,
    evaluated on what is on disk: zero dropped glyphs; a report.ink.json that is
    not superseded by a newer .REFUSED/.MISPAIRED; residual bullets AND the full
    legend on the page, with a flat single-class distribution refused as a
    pairing failure rather than a result; report.pdf, the .md, the inspect.html
    and report.ink.json all present; and the numbers the index row is built from
    (pages, equations, residual distribution, refined-row count) readable. Every
    check names what it looked at, and a check that cannot see its input FAILS
    rather than passing quietly. Prints the handover line for a ready document.'
  requires:
  - reporttex
  positionals:
  - name: pdf
    type: pdf
    required: true
    help: PDF path, https URL, or bare arXiv id
  flags:
  - name: as_json
    flag: --json
    type: bool
    help: machine-readable form for the pages CLI (ready, fields, per-check detail)
  typed: true
- name: pageside
  section: Introspection (fast, no extraction)
  summary: Classify each page recto/verso (book left/right) from page-number parity+position + side-note
    column asymmetry + sequence alternation; attaches page_side to model Pages (column roles flip with
    the side)
  offline_ok: true
  positionals:
  - name: pdf
    type: pdf
    required: true
    help: PDF path, https URL, or bare arXiv id
  typed: true
- name: entities
  section: Introspection (fast, no extraction)
  summary: 'Commercial entities per page: IBAN (mod-97 validated + BLZ/Konto/bank), BIC, German address,
    Steuer-/Kassen-/Aktenzeichen. Zero external tools'
  offline_ok: true
  positionals:
  - name: pdf
    type: pdf
    required: true
    help: PDF path, https URL, or bare arXiv id
  typed: true
  flags:
  - *id001
- name: segment
  section: Introspection (fast, no extraction)
  summary: Partition a scanned bundle into ordered documents (by sender/identifier + continuity number);
    flags duplicate copies
  offline_ok: true
  positionals:
  - name: pdf
    type: pdf
    required: true
    help: PDF path, https URL, or bare arXiv id
  typed: true
  flags:
  - *id001
- name: elements
  section: Introspection (fast, no extraction)
  summary: Find layout elements (postal address / BOM line) via the geometric-attention GNN over tesseract
    word boxes → content-addressed tiddlers (--model M.npz)
  offline_ok: true
  positionals:
  - name: pdf
    type: pdf
    required: true
    help: PDF path, https URL, or bare arXiv id
  typed: true
  flags:
  - name: model
    flag: --model
    type: path
    help: trained GNN .npz
  - name: bibkey
    flag: --bibkey
    type: str
  - name: source
    flag: --source
    type: str
  - name: lang
    flag: --lang
    type: str
    default: deu+eng
  - name: ppi
    flag: --ppi
    type: int
    default: 300
  - *id001
- name: semantic
  section: Introspection (fast, no extraction)
  summary: 'Build the semantic graph (CSP): extractors become sensors emitting evidence; entities (Company/Person/BankAccount)
    accumulate it. --store graph.json accumulates ACROSS documents'
  offline_ok: true
  positionals:
  - name: pdf
    type: pdf
    required: true
    help: PDF path, https URL, or bare arXiv id
  flags:
  - name: store
    type: path
    flag: --store
    help: accumulate across docs
  typed: true
  requires:
  - model
- name: qr
  section: Introspection (fast, no extraction)
  summary: 'Scan QR codes & barcodes (zxing-cpp): GiroCode/EPC payment QR (creditor/IBAN/amount/reference)
    + Data Matrix franking marks — confirmation data outside the text layer. --dpi 300 --formats QRCode,DataMatrix'
  offline_ok: true
  positionals:
  - name: pdf
    type: pdf
    required: true
    help: PDF path, https URL, or bare arXiv id
  flags:
  - name: dpi
    type: int
    flag: --dpi
    default: 300
  - name: formats
    type: str
    flag: --formats
    help: QRCode,DataMatrix
  typed: true
- name: fontid
  section: Introspection (fast, no extraction)
  summary: 'VISUAL font id for scanned/OCR input (no font layer): WORD crops → torch-free ONNX font-classify
    → vote WITHIN each OCR block, so font is reported per text FIELD (heading/body/fine-print), not one
    doc vote. Per-field confidence; weak on scanned generic sans. --limit 12 --ppi 200'
  offline_ok: true
  positionals:
  - name: pdf
    type: pdf
    required: true
    help: PDF path, https URL, or bare arXiv id
  typed: true
  flags:
  - name: pages
    flag: --pages
    type: pages
  - name: limit
    flag: --limit
    type: int
    default: 12
  - name: ppi
    flag: --ppi
    type: int
    default: 200
- name: spellqc
  section: Introspection (fast, no extraction)
  summary: 'Dictionary-assisted de-hyphenation QC (hunspell via spylls→enchant→.dic-set, on-demand per
    language): join/keep/REVIEW each line-break hyphen. Surfaces OCR fragments to fix'
  offline_ok: true
  positionals:
  - name: pdf
    type: pdf
    required: true
    help: PDF path, https URL, or bare arXiv id
  typed: true
  flags:
  - name: lang
    flag: --lang
    type: str
    help: de|en (auto-detected if omitted)
- name: ordered
  section: Introspection (fast, no extraction)
  summary: Segment an ORDERED scan stack into documents (gap scoring + DataMatrix tracking codes → 2-level
    mailing/letter-enclosure). Commercial provenance (publisher=sender, receiver). --threshold 0.5. (Shuffled
    bundle → use `segment`)
  offline_ok: true
  positionals:
  - name: pdf
    type: pdf
    required: true
    help: PDF path, https URL, or bare arXiv id
  typed: true
  flags:
  - name: threshold
    flag: --threshold
    type: str
    default: '0.5'
    help: gap cut score 0..1
- name: autosegment
  section: Introspection (fast, no extraction)
  summary: 'AUTO-PICK ordered vs shuffled: contiguous per-sender runs → `ordered` (gap scorer); interleaved
    → `segment` (signature grouping). Then runs the right one'
  offline_ok: true
  positionals:
  - name: pdf
    type: pdf
    required: true
    help: PDF path, https URL, or bare arXiv id
  typed: true
  flags:
  - name: threshold
    flag: --threshold
    type: str
    default: '0.5'
    help: gap cut score 0..1
- name: selftest
  section: Introspection (fast, no extraction)
  summary: 'DIAGNOSTIC GRID: run the command battery across a PDF (or every PDF in a folder), log OK/⊘-n/a/✗-ERROR
    + the actual result per command → selftest.log. --full adds entities/elements/semantic'
  offline_ok: true
  positionals:
  - name: target
    type: path
    required: true
    help: pdf or dir
  flags:
  - name: full
    type: flag
    flag: --full
  typed: true
- name: rasterize
  section: Introspection (fast, no extraction)
  summary: Rasterize page(s) to PNG/JPEG for visual inspection (Ghostscript, >=400 DPI) → sidecar;
    --pages N|N-M|all --dpi 400. Read the images to see charts/equations/layout
  offline_ok: true
  positionals:
  - name: pdf
    type: pdf
    required: true
    help: PDF path, https URL, or bare arXiv id
  flags:
  - name: pages
    type: pages
    flag: --pages
    default: all
    help: N | N-M | all
  - name: dpi
    type: int

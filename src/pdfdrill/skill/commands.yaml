    help: compile report.pdf with xelatex (error-row demotion fixpoint)
  - name: no_images
    flag: --no-images
    type: flag
    help: skip the CDN crop download / scan-image column
  - name: min_conf
    flag: --min-conf
    type: str
    help: 'only rows with MathPix confidence >= F (rows with NO confidence are dropped
      when either bound is given)'
  - name: max_conf
    flag: --max-conf
    type: str
    help: 'only rows with MathPix confidence <= F (rows with NO confidence are dropped

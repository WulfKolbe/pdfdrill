    no-grounded-answer, zero paragraphs quoted. On a fresh model it usually WITHHOLDS (nothing is
    span-verified yet) — for practical question-answering use `retrieve` (grounded context) + synthesis
    as the primary path; `ask` is the strict verified-only mode. Proof block with witness ids +
    recompute details; the turn persists via chatlog'
  offline_ok: true

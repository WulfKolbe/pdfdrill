    help: 'review format: colour-banded confidence square + residual-class
      bullet per equation row (with --ink, the residual code as selectable
      text). No AcroForm field: 157 established that nothing in the pipeline
      ever re-filled one'
  - name: render_regions
    flag: --render-regions
    type: flag
    help: 'in the image-regions section, set each region''s own LaTeX beside its crop where one
      exists (tikzpicture/tikzcd/listing/math). OFF by default: 1,788 of 27,287 corpus rows carry
      any LaTeX, and on 2208.01506 25 of 43 rendered cells failed to compile and were demoted, so
      the yield is real but so is the hazard'
  - name: prefer_refined
    flag: --prefer-refined
    type: bool
    help: 'project each row from a RECORDED, VERIFIED refinement where one
      exists (refine''s provenance="change" realization) instead of the OCR
      reading. The model is not changed — `latex` still holds what MathPix
      said; the projection chooses. Every such row is marked [refined: basis]
      beside its identifier and the page states how many and on what basis'
  - name: refined
    flag: --refined
    type: flag
    help: 'build refine.report.tex instead (deliberately NOT report.*, which
      a glob would sweep alongside the published report.pdf): one row per
      refined object with
      conf | ink before | ink after | verdict, read from changes.json (needs
      no tiddlers or crops). Rejected rows are shown too — the question is what
      was tried and what happened to it, not only what changed'
  - name: ink
    flag: --ink
    type: path
    help: 'OVERRIDE the residual source. With no --ink, reporttex ADOPTS the
      document''s own report.ink.json when one exists, which is what makes the
      two-phase loop work without a human: the ink pass needs a report to
      measure, so build the report, measure it, then RE-RUN reporttex and the
      residuals are picked up automatically. Residual data implies the residual
      column. Value is a fill_ink_fields.py --json dump; colours each residual bullet from the
      MEASURED class and prints the code as selectable text beside the field (the
      class cannot be known on the first build — inkdrill derives it FROM the
      finished PDF, so this is the second pass)'
  typed: true
- name: report
  section: Introspection (fast, no extraction)
  summary: Full inline+display math report (formula-report.html). --scale N scales each KaTeX render to
    the CDN image height (1.0=same, 2.0=200%); --embed
  offline_ok: true
  positionals:
  - name: pdf
    type: pdf
    required: true
    help: PDF path, https URL, or bare arXiv id
  flags:
  - name: scale
    type: str
    flag: --scale
    help: KaTeX scale vs CDN image (1.0=same)
  - name: embed
    type: flag
    flag: --embed
    help: base64-inline crops (offline)
  typed: true
  requires:
  - model
- name: inspect
  section: Introspection (fast, no extraction)
  summary: 'DevTools-style docmodel inspector HTML (<bibkey>.inspect.html): every DocObject as a
    hover/click box on the rendered page AND a DOM-like ELEMENTS tree + INSPECTOR pane (region/LaTeX/
    props/realizations/alignments) + reading-order REFLOW. Self-contained (embeds downscaled pages);
    --no-images = boxes-only; --dpi N inlined-page DPI (default 120)'
  offline_ok: true
  positionals:
  - name: pdf
    type: pdf
    required: true
    help: PDF path, https URL, or bare arXiv id
  flags:
  - name: pages
    type: str
    flag: --pages
    help: N|N-M|all (default all)
  - name: dpi
    type: str
    flag: --dpi
    help: inlined-page DPI (default 120)
  - name: no-images
    type: flag
    flag: --no-images
    help: boxes-only, skip page rasterization
  typed: true
  requires:
  - model
  - geometry
  - mathpix
- name: folder
  section: Introspection (fast, no extraction)
  summary: Build the full structure for every PDF in <dir> from existing
  offline_ok: true
  positionals:
  - name: dir
    type: dir
    required: true
    help: directory of PDFs (offline batch)
  typed: true
- name: latex
  section: Projection / export
  summary: 'PROJECT the docmodel to LaTeX (<drill>/latex/<bibkey>.tex) — the LaTeX analog of `md`; reads
    the unified Document, so the SOURCE that built it (MathPix/arXiv/tesseract/textscan) is IRRELEVANT.
    Resolves transclusion markers ({{id||FO}}→$..$ by array lookup), emits cite commands, builds the
    bibliography from References (+ a .bib). Compile with XELATEX (not pdflatex — the model can carry raw Unicode
    ≥ ✓ → ℃); --compile runs it, --dump-stages writes the inspectable stages. OUTPUT direction — for a
    source use `injectlatex`; for enriched LaTeX (glossary/index, ORKG) use `stex`/`scikgtex`.'
  offline_ok: true
  requires:
  - model
  positionals:
  - name: pdf
    type: pdf
    required: true
    help: PDF path, https URL, or bare arXiv id
  flags:
  - name: force
    type: flag
    flag: --force
    help: re-unpack/re-project even if <drill>/latex/ already has a .tex
  - name: compile
    type: flag
    flag: --compile
    help: compile the environment with xelatex and report the produced PDF
  - name: dump_stages
    type: flag
    flag: --dump-stages
    help: 'write the inspectable generation stages (transclusion lookup / citations / bibliography) to <drill>/latex/stages/'
  typed: true
- name: beamer
  section: Projection / export
  summary: 'PROJECT the docmodel to a LaTeX **beamer** slide deck (<drill>/latex/<bibkey>.beamer.tex) —
    one frame per Section (allowframebreaks so long content auto-continues), a title + outline + References
    frame. Same source-agnostic docmodel projection as `latex` (transclusions, cite commands, lists all
    resolve), a deck instead of an article. Compile with XELATEX; --compile runs it.'
  offline_ok: true
  requires:
  - model
  positionals:
  - name: pdf
    type: pdf
    required: true
    help: PDF path, https URL, or bare arXiv id
  flags:
  - name: force
    type: flag
    flag: --force
    help: re-project even if the deck exists
  - name: compile
    type: flag
    flag: --compile
    help: compile the deck with xelatex and report the produced PDF
  typed: true
- name: injectlatex
  requires:
  - mathpix
  done_when: fact:LATEX_INGESTED
  section: Introspection (fast, no extraction)
  summary: 'INJECT the author''s LaTeX source (.tex/.tgz, arXiv e-print auto-downloaded) as a competing
    `tex` provenance on each matched equation (original+expanded LaTeX). INPUT direction (was `latex`);
    for LaTeX OUTPUT use `latex`. --tex <path>'
  offline_ok: true
  positionals:
  - name: pdf
    type: pdf
    required: true
    help: PDF path, https URL, or bare arXiv id
  flags:
  - name: tex
    type: path
    flag: --tex
    help: author .tex/.tgz
  typed: true
- name: merge
  section: Introspection (fast, no extraction)
  summary: 'Merge gold LaTeX prose onto a layout skeleton (MathPix OR born-digital pdfminer/pdfplumber OR
    tesseract): the model''s Paragraphs fix the boundaries + regions, the author LaTeX supplies the text
    (LaTeX always wins; original kept as text_source). On a born-digital 2-column paper this DROPS the
    column interleaving + arXiv margin watermark from the prose. Refuses a source-built model (already
    gold). Needs a model + a LaTeX source.'
  offline_ok: true
  requires:
  - model
  positionals:
  - name: pdf
    type: pdf
    required: true
    help: PDF path, https URL, or bare arXiv id
  flags:
  - name: tex
    type: path
    flag: --tex
    help: author .tex/.tgz (else local sibling or arXiv e-print)
  typed: true
- name: fontspans
  section: Introspection (fast, no extraction)
  summary: 'The pdfminer LEG: recover the local formatting MathPix flattens — bold headings, bold/italic key
    terms, COLOURED runs (red/blue link text), small footnotes/captions — from the born-digital glyph layer
    via pdfminer.six (fontname/size/CTM/colour). Writes <bibkey>.fontspans.json, attaches per-page emphasis
    onto Page objects + fuses inline emphasis onto the merged Paragraphs by page-fraction overlap, and
    cross-checks visual bold+larger headings against the model Sections (confirms matches; flags missed
    headings as repair candidates). Born-digital only.'
  offline_ok: true
  positionals:
  - name: pdf
    type: pdf
    required: true
    help: PDF path, https URL, or bare arXiv id
  flags:
  - name: pages
    flag: --pages
    type: str
    help: page selector N | N-M | all (default all)
  typed: true

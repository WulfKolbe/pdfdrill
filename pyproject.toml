[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pdfdrill"
version = "0.1.0"
description = "Token-economical drill-down extraction + PDF->LaTeX OCR quality control"
readme = "README.md"
license = "LicenseRef-Prosperity-3.0.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "pdfminer.six>=20221105",
    "pdfplumber>=0.11",
    "pydantic>=2.0",
    "pypdf>=4.0",
    "PyYAML>=6.0",
    # NumPy IS THE FREE LANE'S FLOOR, not an extra. docs/LANES.md makes the
    # geometry lane the LAST RESORT that always exists — the one reading a
    # keyless install can always reach — and its first half is the page's own
    # ink, which is NumPy. While numpy sat only in [layout], the documented
    # install (bootstrap.sh + pip install -e .) produced a box where `drill
    # <scan>` exited 0, wrote nothing, and said "ink geometry needs numpy",
    # while `doctor` printed the lane OK. A last resort behind an extra is not
    # a last resort.
    "numpy>=1.24",
]

[project.optional-dependencies]
# Scan acquisition (`pdfdrill scan`) — the VENDORED rig at pdfdrill.scandrill
# (absorbed from the SCANDRILL project). These are its deps, now ours; the SANE
# tools (`scanimage`) are a system package, see bootstrap.sh / doctor. Absent →
# `scan` degrades to a hint, every other route is unaffected.
scan = [
    "img2pdf>=0.5",     # lossless image → PDF (JPEG /DCTDecode verbatim, no re-encode)
    "pikepdf>=8",       # /Lang, page labels, metadata — no pixel touch
    "Pillow>=10",       # page dimensions + blank-mean measurement
]
nlp = ["stanza>=1.10"]
# RUNNING THE SUITE. CLAUDE.md documents `python3 -m pytest tests/`, and until
# 2026-10-21 nothing installed pytest: not requirements.txt, not this file, not
# bootstrap.sh. It arrived only as a side effect of
# `vendor/install-pdfminer-fork.sh`, which installed pillow+scipy+pytest into
# whatever interpreter was active — and once that stopped (HANDOVER-RULES 33,
# an installer installs what it names) the documented test command could not be
# run from the documented install at all. So name it.
dev = ["pytest>=7.0"]
# la2speech (vendored): LaTeX -> MathML -> speech. The npm
# speech-rule-engine itself is installed by
# src/pdfdrill/la2speech/setup.sh (needs node), not by pip.
speech = ["latex2mathml>=3.77", "pylatexenc>=2.10"]
# Canonical math layer (the `mathlayer` package): LaTeX→SymPy→multi-backend.
math = ["sympy>=1.12", "latex2sympy2_extended>=1.11"]
# Additive commercial-document feature extractors (the `features` package).
# networkx + rapidfuzz are the core; the rest back individual extractors and
# are imported lazily (each extractor degrades to [] when its lib is absent).
features = [
    "networkx>=3.0",
    "rapidfuzz>=3.0",
    "dateparser>=1.2",
    "phonenumbers>=8.13",
    "price-parser>=0.3.4",
    "probablepeople>=0.5.5",
    "usaddress>=0.5.10",
    "email-validator>=2.0",
]
# Layout-element GNN (the vendored `pdfdrill.tsv_gcn`): a pure-NumPy
# geometric-attention model over the document's word boxes that isolates addresses /
# BOM line items as content-addressed tiddlers (`pdfdrill elements`). numpy is
# required for the GNN; blake3 is optional (content_hash falls back to sha256).
# The vendored `pdfdrill.extract_addresses` heuristic (no-model address path) is
# pure-stdlib — no extra needed. libpostal/pypostal (`postal`) is an OPTIONAL
# upgrade that PARSES a found address block into components; it's wired as an
# enrichment step (auto-used when present; the .so is ctypes-preloaded from
# /usr/local/lib so it works without ldconfig/root). Install: build libpostal
# from source, then `pip install postal`. Not declared here (the C-lib build is
# not pip-installable); pdfdrill degrades silently to the raw block when absent.
layout = [
    # numpy moved to the base dependencies — the geometry lane needs it, not
    # just the GNN. Kept named here so the extra still states its own needs.
    "numpy>=1.24",
    "blake3>=0.4",
]
# QR / barcode scanning (`pdfdrill qr`): GiroCode/EPC payment QR + Data Matrix
# franking marks as confirmation data. zxing-cpp is the decode engine; pages are
# rasterized with Ghostscript (>=400 DPI; the only rasterizer, no PyMuPDF). Degrades cleanly.
qr = [
    "zxing-cpp>=2.0",
]
# Local MathPix-free image server (tools/imageserver/ + src/pdfdrill/eqcrop.py):
# a 600-DPI Ghostscript DZI pyramid serves the cdn.mathpix.com crops + a deep-zoom
# viewer locally. Pillow does the region crops; pyvips (libvips) does the dzsave
# tiling for `pdfdrill pyramid`. gs is already a hard requirement.
# pyvips[binary] pulls a wheel that BUNDLES libvips, so `pip install
# 'pdfdrill[imageserver]'` works with NO system package / no root. If you prefer
# the system lib, `apt-get install libvips-tools` (bootstrap.sh does) + plain pyvips.
imageserver = [
    "pillow>=10.0",
    "pyvips[binary]>=2.2",
]
# Language detection accuracy upgrade (features.extract_language). Without it the
# pure-Python stopword fallback (or langdetect, if present) is used — detection
# always works offline. lingua is best on short/mixed text.
lang = [
    "lingua-language-detector>=2.0",
    "langdetect>=1.0",
]
# Hunspell-backed spellcheck + de-hyphenation QC (pdfdrill.spellqc). pyenchant
# wraps libhunspell (best where it has the language, e.g. en_US). spylls is the
# pure-Python Hunspell — reads .aff/.dic with no C build/binding, ideal for a
# locked-down sandbox (vendor it / it has no install-time C deps). The pure
# .dic-word-set floor needs neither. German needs de_DE.{aff,dic} on disk.
spell = [
    "pyenchant>=3.2",
    "spylls>=0.1.7",
]
# Visual font identification for scanned input (pdfdrill.font_classify): the
# torch-free storia/font-classify ONNX path — onnxruntime + opencv + pyyaml only
# (NO torch/timm/huggingface_hub). The ~61 MB model is fetched on demand to
# $FONT_CLASSIFY_DIR / ~/.cache/pdfdrill. Google-Fonts classes only.
fontid = [
    "onnxruntime>=1.16",
    "opencv-python-headless>=4.8",
    "pyyaml>=6.0",
]

[project.scripts]
pdfdrill = "pdfdrill.cli:main"
# T-0045 / ENGINEERING 2d: the reader is a producer of lines.json, so it has a
# front door of its own. Without one, nothing a user types produces its output
# and the reader is unreachable from outside the repo. `streamreader_entry`
# runs `streamreader.cli` unchanged and stamps the `source` the reader's format
# has no field for; it sits outside the package because every module in
# `src/streamreader/` is byte-identical to pdf2mmd2@5190249 by test.
pdf2mmd2 = "streamreader_entry:main"

# WHICH FILES ARE "THE SUITE". Without `testpaths`, a bare `python3 -m pytest`
# from the root walks the whole tree and collected ONE file `pytest tests/`
# never saw — `src/pdfreader/out/test_table.py`, 23 tests: 5955 against 5932,
# measured. Worse than the discrepancy: that file has no package beside it, so
# pytest's prepend import mode put `src/pdfreader/out` first on `sys.path` for
# the rest of the session, and `import langdetect` then found a subprocess tool
# instead of the PyPI package. A peer session measured 33 failures from it.
# Pinned here so the command a newcomer types IS the documented command.
[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
# `streamreader*` is here because `pdf2mmd2` above is a console script: a
# non-editable install would ship the script and not the package it calls.
# The editable install hid that -- its path hook exposes the whole of `src/`,
# so `import streamreader` worked while a built wheel would not have carried it.
include = ["pdfdrill*", "docmodel*", "docops*", "features*", "semantic*", "vocabnet*",
           "streamreader*"]

[tool.setuptools]
# The reader's entry point is a single module, not a package, so `find` above
# cannot see it. (`pdfreader`, `mathlayer`, `mathgold` and `passes` are also
# absent from `include` and are NOT addressed here: they predate this task and
# removing them from a wheel is a separate measurement.)
py-modules = ["streamreader_entry"]

[tool.setuptools.package-data]
# the bundled font-category table (offline; built by tools/build_font_categories.py),
# the skillsync-generated --help body, and the complete bundled SKILL folder
# (commands.yaml manifest + SKILL.md) so `pdfdrill skill` works from an installed wheel.
pdfdrill = ["font_categories.json", "_help_generated.txt", "skill/*",
            # 466: the runtime prompts. Canonical copy is docs/prompts/; this
            # is tools/promptsync.py's bundle, for the same reason as
            # scandrill.toml below — an installed wheel has no project root.
            "prompts_data/*",
            # the vendored acquisition rig's config — it documents the fixed rig
            # (ADF Duplex @300dpi, deskew on) and must travel WITH the package,
            # since there is no project root to search upward to once installed.
            "scandrill/scandrill.toml",
            # `repo_publish` reads these three through
            # `Path(__file__).parent / "repo_templates"`, so they are read the
            # same way `font_categories.json` is and were missing for the same
            # reason (T-0078).
            "repo_templates/*",
            # the vendored la2speech engine's installer, named by `doctor` and
            # by the speech hint — a path printed to the user that does not
            # exist is a dead end, not a hint.
            "la2speech/setup.sh"]
# T-0078. EVERY package that reads a file beside its own modules needs a key
# here, and only `pdfdrill` had one. `docmodel.main` read its module manifest
# `config.json`, `type_contract`/`prop_contract` read the five corpus
# inventories, `docops.main` reads `default_config.json` and `docops.conserve`
# reads the `--gate` baseline — all by `Path(__file__)`, all absent from every
# wheel ever built here. `tests/test_an_install_outside_the_owners_tree.py`
# fails if a new such read appears with no pattern covering it.
docmodel = [
    "config.json",          # the 24-entry module manifest (19 modules)
    "corpus_types.json", "corpus_fields.json", "corpus_values.json",
    "corpus_props.json", "props_code.json",
]
docops = [
    "default_config.json",      # the default projector pipeline
    "conserve_baseline.json",   # the `conserve --gate` ratchet
    "nlp_config.json",
]
